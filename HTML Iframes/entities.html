<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Entities</title>
  </head>
  <body>
    <p>
      Less than: &lt; <br />
      Greater than: &gt; <br />
      Ampersand: &amp; <br />
      Double quote: &quot; <br />
      Single quote/apostrophe: &apos; <br />
      Copyright: &copy; <br />
      Trademark: &trade; <br />
      Registered: &reg;
    </p>
  </body>
