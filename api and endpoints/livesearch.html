<!DOCTYPE html>
<html>
  <head>
    <title>Live Search</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
      .result {
        display: flex;
        gap: 10px;
        padding: 10px;
        border-bottom: 1px solid #ddd;
      }
      img {
        width: 60px;
        height: 60px;
        object-fit: cover;
      }
      #loading {
        display: none;
        color: blue;
      }
    </style>
  </head>
  <body>
    <h2>Live Search (Products)</h2>
    <input id="search" placeholder="Search products..." />
    <span id="loading">Loading...</span>

    <div id="results"></div>

    <script>
      $(document).ready(function () {
        $("#search").on("keyup", function () {
          let q = $(this).val();
          $("#loading").show();

          $.ajax({
            url: "http://localhost:3000/products?q=" + q,
            method: "GET",
            success: function (data) {
              $("#loading").hide();
              $("#results").empty();

              if (data.length === 0) {
                $("#results").html("<p>No products found</p>");
                return;
              }

              data.forEach((p) => {
                $("#results").append(`
            <div class="result">
              <img src="${p.image}">
              <div>
                <h4>${p.name}</h4>
                <p>Price: ₹${p.price}</p>
              </div>
            </div>
          `);
              });
            },
          });
        });
      });
    </script>
  </body>
</html>
