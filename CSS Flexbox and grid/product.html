<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Grid</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f2f2f2;
        padding: 40px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
      }

      .card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.1);
        height: 180px; /* Equal height */
        display: flex;
        flex-direction: column;
        justify-content: center;
        transition: 0.3s;
      }

      .card:hover {
        transform: scale(1.05);
      }

      .card h3 {
        font-size: 1.2rem;
        margin-bottom: 10px;
      }

      .card p {
        font-size: 1rem;
        color: #555;
      }

      /* Tablet - 2 columns */
      @media (max-width: 900px) {
        .grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      /* Mobile - 1 column */
      @media (max-width: 600px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <h2 style="text-align: center; margin-bottom: 20px">Product Gallery</h2>

    <div class="grid">
      <div class="card">
        <h3>Product 1</h3>
        <p>$15</p>
      </div>

      <div class="card">
        <h3>Product 2</h3>
        <p>$20</p>
      </div>

      <div class="card">
        <h3>Product 3</h3>
        <p>$18</p>
      </div>

      <div class="card">
        <h3>Product 4</h3>
        <p>$25</p>
      </div>

      <div class="card">
        <h3>Product 5</h3>
        <p>$30</p>
      </div>

      <div class="card">
        <h3>Product 6</h3>
        <p>$12</p>
      </div>

      <div class="card">
        <h3>Product 7</h3>
        <p>$17</p>
      </div>

      <div class="card">
        <h3>Product 8</h3>
        <p>$22</p>
      </div>
    </div>
  </body>
</html>
