<!-- upload.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Upload Image</title>
  </head>
  <body>
    <h2>Upload an image</h2>
    <p>Allowed file types: .jpg and .png (images only).</p>
    <form action="#" method="post" enctype="multipart/form-data">
      <label
        >Select image:
        <input
          type="file"
          name="image"
          accept=".jpg,.jpeg,.png"
          required /></label
      ><br /><br />
      <button type="submit">Upload</button>
    </form>
  </body>
</html>
