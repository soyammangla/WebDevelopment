<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Border & Padding Demo</title>

    <style>
      body {
        font-family: Arial;
        background: #f5f5f5;
        margin: 0;
        padding: 30px;
      }

      h1 {
        text-align: center;
        margin-bottom: 30px;
      }

      .container {
        display: flex;
        gap: 20px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .box {
        width: 180px;
        padding: 20px;
        background: white;
        transition: border-color 0.4s ease;
        text-align: center;
        font-weight: bold;
      }

      .solid {
        border: 4px solid #333;
      }
      .dashed {
        border: 4px dashed #333;
      }
      .double {
        border: 6px double #333;
      }
      .groove {
        border: 6px groove #333;
      }

      .rounded {
        border-radius: 15px;
      }

      .box:hover {
        border-color: crimson;
      }
    </style>
  </head>
  <body>
    <h1>Border & Padding Demonstration</h1>

    <div class="container">
      <div class="box solid">Solid Border</div>
      <div class="box dashed">Dashed Border</div>
      <div class="box double">Double Border</div>
      <div class="box groove">Groove Border</div>
      <div class="box solid rounded">Rounded Corners</div>
      <div class="box dashed rounded">Rounded + Padding</div>
    </div>
  </body>
</html>
