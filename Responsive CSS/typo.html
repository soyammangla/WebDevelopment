<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Typography</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6fb;
        padding: 50px;
        text-align: center;
      }
      h1 {
        font-size: clamp(1.5rem, 4vw, 3rem);
        margin-bottom: 20px;
      }
      p {
        font-size: clamp(1rem, 2vw, 1.5rem);
        line-height: 1.6;
        margin: 0 auto;
        max-width: 600px;
      }
      @media (max-width: 700px) {
        p {
          line-height: 1.4;
          margin: 0 20px;
        }
      }
    </style>
  </head>
  <body>
    <h1>Responsive Typography Example</h1>
    <p>
      This text automatically adjusts its font size according to the screen
      width using the clamp() function. On smaller screens, line-height and
      spacing are adjusted for better readability.
    </p>
  </body>
</html>
