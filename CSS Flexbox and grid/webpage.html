<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex + Grid Layout</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px;
        background: #222;
        color: #fff;
      }

      nav ul {
        display: flex;
        gap: 20px;
        list-style: none;
      }

      nav ul li a {
        color: #fff;
        text-decoration: none;
      }

      /* MAIN GRID */
      .container {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 20px;
        padding: 20px;
      }

      article {
        background: #fafafa;
        padding: 20px;
        border-radius: 10px;
        animation: fadeIn 1.2s ease;
      }

      /* Animation */
      @keyframes fadeIn {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .three-boxes {
        display: flex;
        gap: 15px;
        margin-top: 20px;
      }

      .three-boxes div {
        flex: 1;
        background: #eee;
        padding: 20px;
        text-align: center;
        border-radius: 10px;
      }

      aside {
        background: #ddd;
        padding: 20px;
        border-radius: 10px;
      }

      footer {
        text-align: center;
        padding: 20px;
        background: #222;
        color: #fff;
        margin-top: 20px;
      }

      /* RESPONSIVE */
      @media (max-width: 800px) {
        .container {
          grid-template-columns: 1fr;
        }

        .three-boxes {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h2>MyWebsite</h2>
      <nav>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
    </header>

    <!-- MAIN GRID -->
    <div class="container">
      <article>
        <h2>Main Article</h2>
        <p>This is the main content area of the webpage.</p>

        <div class="three-boxes">
          <div>Box 1</div>
          <div>Box 2</div>
          <div>Box 3</div>
        </div>
      </article>

      <aside>
        <h3>Sidebar</h3>
        <p>Some useful links and categories here.</p>
      </aside>
    </div>

    <footer>© 2025 MyWebsite. All Rights Reserved.</footer>
  </body>
</html>
