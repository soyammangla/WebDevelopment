<!DOCTYPE html>
<html>
  <head>
    <title>Interactive FAQ</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
      .faq-box {
        width: 450px;
        margin: auto;
        padding: 20px;
      }
      .question {
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        padding: 10px;
      }
      .answer {
        display: none;
        padding: 10px;
        background: #f3f3f3;
      }
      input {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="faq-box">
      <div class="question">What is JavaScript?</div>
      <div class="answer">
        JavaScript is a programming language. <br /><input
          type="text"
          placeholder="Type here"
        />
      </div>

      <div class="question">What is jQuery?</div>
      <div class="answer">
        jQuery is a JS library. <br /><input
          type="text"
          placeholder="Type here"
        />
      </div>

      <div class="question">What is HTML?</div>
      <div class="answer">
        HTML is a markup language. <br /><input
          type="text"
          placeholder="Type here"
        />
      </div>
    </div>

    <script>
      $(function () {
        // 1. Toggle answer
        $(".question").click(function () {
          $(this).next(".answer").slideToggle();
        });

        // 2. Hover
        $(".question").hover(
          function () {
            $(this).css("color", "blue");
          },
          function () {
            $(this).css("color", "black");
          }
        );

        // 3. Double click collapse all
        $(".question").dblclick(function () {
          $(".answer").slideUp();
        });

        // 4 + 5. Focus & Blur highlight
        $("input").focus(function () {
          $(this).parent().css("background", "#fffa90");
        });

        $("input").blur(function () {
          $(this).parent().css("background", "#f3f3f3");
        });
      });
    </script>
  </body>
</html>
