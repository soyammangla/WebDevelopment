<!DOCTYPE html>
<html>
  <head>
    <title>Form Validation</title>
    <style>
      body {
        font-family: Arial;
        padding: 20px;
      }

      form {
        width: 300px;
      }

      input {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border: 2px solid #ccc;
        border-radius: 6px;
        outline: none;
      }

      .error {
        color: red;
        font-size: 14px;
        margin-bottom: 5px;
        display: none;
      }

      #success {
        color: green;
        font-size: 18px;
        font-weight: bold;
        margin-top: 10px;
        display: none;
      }
    </style>
  </head>
  <body>
    <h2>Form Validation</h2>

    <form id="myForm">
      <input type="text" id="name" placeholder="Enter Name" />
      <div class="error" id="nameError">Name is required</div>

      <input type="email" id="email" placeholder="Enter Email" />
      <div class="error" id="emailError">Enter a valid email</div>

      <input type="password" id="password" placeholder="Enter Password" />
      <div class="error" id="passError">
        Password must be at least 6 characters
      </div>

      <button type="submit">Submit</button>
    </form>

    <div id="success">Form Submitted Successfully</div>

    <script>
      const form = document.getElementById("myForm");

      const nameInput = document.getElementById("name");
      const emailInput = document.getElementById("email");
      const passInput = document.getElementById("password");

      const nameError = document.getElementById("nameError");
      const emailError = document.getElementById("emailError");
      const passError = document.getElementById("passError");
      const success = document.getElementById("success");

      // Validation function
      function validateForm(e) {
        let isValid = true;

        // NAME
        if (nameInput.value.trim() === "") {
          nameError.style.display = "block";
          isValid = false;
        } else {
          nameError.style.display = "none";
        }

        // EMAIL
        if (!emailInput.value.includes("@") || emailInput.value.trim() === "") {
          emailError.style.display = "block";
          isValid = false;
        } else {
          emailError.style.display = "none";
        }

        // PASSWORD
        if (passInput.value.length < 6) {
          passError.style.display = "block";
          isValid = false;
        } else {
          passError.style.display = "none";
        }

        if (!isValid) {
          e.preventDefault(); // block form submission
          success.style.display = "none";
        } else {
          e.preventDefault(); // allow preview but not real submission
          success.style.display = "block";
        }
      }

      // Run validation on form submit
      form.addEventListener("submit", validateForm);

      // Remove errors live while typing
      nameInput.addEventListener(
        "input",
        () => (nameError.style.display = "none")
      );
      emailInput.addEventListener(
        "input",
        () => (emailError.style.display = "none")
      );
      passInput.addEventListener(
        "input",
        () => (passError.style.display = "none")
      );
    </script>
  </body>
</html>
