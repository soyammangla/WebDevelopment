<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filter Comparison</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f6f7fb;
        padding: 40px;
        text-align: center;
      }
      h1 {
        margin-bottom: 20px;
      }
      .comparison {
        display: flex;
        gap: 20px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .comparison img {
        width: 300px;
        border-radius: 10px;
        filter: brightness(0.7);
        transition: all 0.4s;
      }
      .comparison img:hover {
        filter: none;
      }
      figure {
        margin: 0;
      }
      figcaption {
        margin-top: 8px;
        font-weight: bold;
      }
      @media (max-width: 700px) {
        .comparison {
          flex-direction: column;
          align-items: center;
        }
      }
    </style>
  </head>
  <body>
    <h1>Filter Comparison</h1>
    <div class="comparison">
      <figure>
        <img src="https://picsum.photos/id/1015/300/200" alt="" />
        <figcaption>Original</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1015/300/200" alt="" />
        <figcaption>Filtered</figcaption>
      </figure>
    </div>
  </body>
</html>
