<!-- youtube-embed.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YouTube Embed (percentage sizing)</title>
  </head>
  <body>
    <h2>YouTube video (resizes with browser)</h2>
    <!-- width and height are percentages so iframe scales with the viewport -->
    <div style="width: 90%; height: 60vh; margin: 0 auto">
      <iframe
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        title="YouTube video player"
        width="100%"
        height="100%"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
      >
      </iframe>
    </div>
  </body>
</html>
