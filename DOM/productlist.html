<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dynamic Product List Manager</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial;
        padding: 20px;
        max-width: 800px;
        margin: auto;
      }
      h1 {
        margin-bottom: 8px;
      }
      .controls {
        margin-top: 8px;
      }
      input[type="text"] {
        padding: 8px;
        width: 60%;
      }
      button {
        padding: 8px 10px;
        margin-left: 6px;
        cursor: pointer;
      }
      ul {
        list-style: none;
        padding: 0;
        margin-top: 12px;
      }
      li {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        padding: 10px;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        margin-bottom: 8px;
      }
      .label {
        flex: 1;
      }
      .editing input.inline-edit {
        width: 100%;
        padding: 6px;
        font-size: 1rem;
      }
      .controls button {
        margin-left: 6px;
      }
      .hint {
        color: #666;
        font-size: 0.9rem;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <h1>Product List Manager</h1>

    <div>
      <input id="newProduct" type="text" placeholder="Enter new product..." />
      <button id="addBtn">Add</button>
      <div class="hint">
        Add products, edit inline, click outside to auto-save. Uses event
        delegation.
      </div>
    </div>

    <ul id="productList" aria-live="polite"></ul>

    <script>
      (function () {
        const input = document.getElementById("newProduct");
        const addBtn = document.getElementById("addBtn");
        const ul = document.getElementById("productList");

        // Add product
        addBtn.addEventListener("click", () => {
          const val = input.value.trim();
          if (!val) return;
          ul.appendChild(createItem(val));
          input.value = "";
          input.focus();
        });

        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") addBtn.click();
        });

        // Create li element for product
        function createItem(text) {
          const li = document.createElement("li");
          const span = document.createElement("span");
          span.className = "label";
          span.textContent = text;

          const controls = document.createElement("span");
          controls.className = "controls";
          controls.innerHTML =
            '<button class="edit">Edit</button><button class="del">Delete</button>';

          li.appendChild(span);
          li.appendChild(controls);
          return li;
        }

        // Event delegation for Edit / Delete
        ul.addEventListener("click", (e) => {
          const btn = e.target.closest("button");
          if (!btn) return;
          const li = btn.closest("li");
          if (!li) return;

          if (btn.classList.contains("del")) {
            li.remove();
            return;
          }

          if (btn.classList.contains("edit")) {
            enterEditMode(li);
          }
        });

        // Enter edit mode (inline input)
        function enterEditMode(li) {
          // If another item is editing, finish it first
          const currentEditing = ul.querySelector(".editing");
          if (currentEditing && currentEditing !== li)
            finishEdit(currentEditing);

          if (li.classList.contains("editing")) return;

          const label = li.querySelector(".label");
          const prev = label.textContent;
          li.classList.add("editing");

          // hide label and insert input
          label.style.display = "none";
          const inputEl = document.createElement("input");
          inputEl.type = "text";
          inputEl.className = "inline-edit";
          inputEl.value = prev;
          li.insertBefore(inputEl, li.firstChild);
          inputEl.focus();
          // place cursor at end
          inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);

          // handle keys: Enter -> save, Escape -> cancel
          function onKey(e) {
            if (e.key === "Enter") {
              finishEdit(li);
            } else if (e.key === "Escape") {
              cancelEdit(li, prev);
            }
          }
          inputEl.addEventListener("keydown", onKey);

          // remember a reference for cleanup if needed
          li._editHandlers = { onKey };
        }

        // Finish edit: save value
        function finishEdit(li) {
          const inputEl = li.querySelector("input.inline-edit");
          if (!inputEl) return;
          const newVal = inputEl.value.trim() || "Untitled";
          const label = li.querySelector(".label");
          label.textContent = newVal;
          cleanupEdit(li);
        }

        // Cancel edit: restore previous value
        function cancelEdit(li, prev) {
          const label = li.querySelector(".label");
          label.textContent = prev;
          cleanupEdit(li);
        }

        // Cleanup after edit (remove input, show label)
        function cleanupEdit(li) {
          const inputEl = li.querySelector("input.inline-edit");
          if (inputEl && li._editHandlers) {
            inputEl.removeEventListener("keydown", li._editHandlers.onKey);
          }
          if (inputEl) inputEl.remove();
          li.classList.remove("editing");
          const label = li.querySelector(".label");
          if (label) label.style.display = "";
          delete li._editHandlers;
        }

        // Auto-save when clicking outside any editing item
        document.addEventListener("click", (e) => {
          const editing = ul.querySelector(".editing");
          if (!editing) return;
          if (!editing.contains(e.target)) {
            finishEdit(editing);
          }
        });

        // Also save on blur of the inline input (covers some edge cases)
        ul.addEventListener("focusout", (e) => {
          const editing = ul.querySelector(".editing");
          if (!editing) return;
          // if focus moved outside the editing li entirely, save
          // use setTimeout to let the new focus target establish
          setTimeout(() => {
            const active = document.activeElement;
            if (!editing.contains(active)) finishEdit(editing);
          }, 0);
        });

        // Small helper: prefill some demo items
        ["Apple", "Banana", "Mango"].forEach((name) =>
          ul.appendChild(createItem(name))
        );
      })();
    </script>
  </body>
</html>
