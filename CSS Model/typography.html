<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typography Demo</title>

    <style>
      body {
        font-family: Georgia;
        padding: 30px;
        line-height: 1.6;
      }
      p::first-line {
        font-weight: bold;
      }
      p::first-letter {
        font-size: 200%;
        color: blue;
      }
      mark {
        background: yellow;
        padding: 2px;
      }
      strong {
        color: crimson;
      }
      em {
        color: seagreen;
      }
    </style>
  </head>
  <body>
    <h1>Typography & Text Styling</h1>

    <p>
      <mark>Typography</mark> is an essential part of web design. Good
      <strong>readability</strong> and proper <em>alignment</em> improve user
      experience significantly.
    </p>
  </body>
</html>
