<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shadows & Depth</title>

    <style>
      body {
        font-family: Arial;
        padding: 30px;
        background: #f4f4f4;
      }
      h1 {
        text-align: center;
        text-shadow: 2px 2px 5px #999;
      }
      .cards {
        display: flex;
        gap: 20px;
        justify-content: center;
      }
      .card {
        width: 200px;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        transition: 0.3s;
      }
      .card:hover {
        transform: translateY(-10px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <h1>Shadow Effects</h1>

    <div class="cards">
      <div class="card">Basic Shadow</div>
      <div class="card">Medium Shadow</div>
      <div class="card">Deeper Shadow</div>
    </div>
  </body>
</html>
