<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3 Section Homepage</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background: #f2f2f2;
      }

      /* HEADER */
      header {
        background: #222;
        color: white;
        padding: 20px;
      }

      nav {
        display: flex;
        justify-content: space-around;
        font-size: 1.1rem;
      }

      nav a {
        color: white;
        text-decoration: none;
        transition: 0.3s;
      }

      nav a:hover {
        opacity: 0.6;
      }

      /* MAIN */
      main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        padding: 40px;
      }

      .box {
        width: 280px;
        height: 180px;
        background: white;
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.15);
        font-size: 1.4rem;
        font-weight: bold;
        transition: 0.3s;
      }

      .box:hover {
        transform: rotate(2deg);
      }

      /* FOOTER */
      footer {
        background: #222;
        color: white;
        text-align: center;
        padding: 15px;
        margin-top: auto;
      }

      /* RESPONSIVE */
      @media (max-width: 800px) {
        main {
          flex-direction: column;
        }

        .box {
          width: 90%;
        }
      }
    </style>
  </head>

  <body>
    <!-- HEADER -->
    <header>
      <nav>
        <a href="#">Home</a>
        <a href="#">Services</a>
        <a href="#">Projects</a>
        <a href="#">Contact</a>
      </nav>
    </header>

    <!-- MAIN -->
    <main>
      <div class="box">Services</div>
      <div class="box">Projects</div>
      <div class="box">Contact</div>
    </main>

    <!-- FOOTER -->
    <footer>© 2025 All Rights Reserved</footer>
  </body>
</html>
