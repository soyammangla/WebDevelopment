<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gradient Backgrounds</title>

    <style>
      body {
        margin: 0;
        font-family: Arial;
      }

      header,
      footer {
        background: #222;
        color: white;
        padding: 15px;
        text-align: center;
        position: sticky;
        top: 0;
      }

      .section1 {
        height: 300px;
        color: white;
        text-align: center;
        padding-top: 100px;
        background: linear-gradient(to right, #ff512f, #dd2476);
      }

      .section2 {
        height: 300px;
        color: white;
        text-align: center;
        padding-top: 100px;
        background: radial-gradient(circle, #36d1dc, #5b86e5);
        background-attachment: fixed;
      }
    </style>
  </head>
  <body>
    <header>Fixed Header</header>

    <div class="section1">Linear Gradient Background</div>

    <div class="section2">Radial Gradient Background with Fixed Attachment</div>

    <footer>Footer Section</footer>
  </body>
</html>
