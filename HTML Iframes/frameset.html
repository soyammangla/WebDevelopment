<!-- frameset-layout.html -->
<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Frameset//EN"
   "http://www.w3.org/TR/html4/frameset.dtd">
<html>
<head>
  <title>Frameset Example</title>
</head>
<frameset rows="20%,80%">
  <!-- top frame: navigation links -->
  <frame src="nav.html" name="topFrame" title="Navigation Links">
  <!-- bottom frame: welcome message -->
  <frame src="welcome.html" name="bottomFrame" title="Welcome Message">
  <noframes>
    <body>
      Your browser does not support frames. Please open the navigation and welcome pages directly.
    </body>
  </noframes>
</frameset>
</html>
