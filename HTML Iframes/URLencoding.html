<!-- uri-encoding.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>URI Encoding</title>
  </head>
  <body>
    <h2>URI Encoding Example</h2>
    <p>
      Unencoded (unsafe in link): https://example.com/search?query=HTML & CSS
    </p>
    <p>Correct encoded link:</p>
    <a href="https://example.com/search?query=HTML%20%26%20CSS"
      >https://example.com/search?query=HTML%20%26%20CSS</a
    >
    <p>
      Notes: spaces are encoded as %20 and & must be encoded as %26 in query
      values.
    </p>
  </body>
</html>
