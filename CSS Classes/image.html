<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Image Showcase</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        font-family: Arial;
        background: #f6f7fb;
      }
      h1 {
        text-align: center;
        margin-bottom: 18px;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        max-width: 1100px;
        margin: 0 auto;
      }
      figure {
        position: relative;
        overflow: hidden;
        border-radius: 10px;
        margin: 0;
        background: #fff;
        box-shadow: 0 8px 20px rgba(2, 6, 23, 0.06);
      }
      img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        display: block;
        transition: transform 0.35s ease;
      }
      figure::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0);
        transition: background 0.35s ease;
      }
      figure:hover img {
        transform: scale(1.1);
      }
      figure:hover::after {
        background: rgba(0, 0, 0, 0.25);
      }
      figcaption {
        padding: 10px;
        font-size: 0.95rem;
        background: #fff;
        text-align: center;
      }
      @media (max-width: 900px) {
        .gallery {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 700px) {
        .gallery {
          grid-template-columns: 1fr;
        }
        img {
          height: 260px;
        }
      }
    </style>
  </head>
  <body>
    <h1>Image Showcase</h1>
    <div class="gallery">
      <figure>
        <img src="https://picsum.photos/id/1011/800/600" alt="" />
        <figcaption>Caption 1</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1025/800/600" alt="" />
        <figcaption>Caption 2</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1035/800/600" alt="" />
        <figcaption>Caption 3</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1043/800/600" alt="" />
        <figcaption>Caption 4</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1052/800/600" alt="" />
        <figcaption>Caption 5</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1060/800/600" alt="" />
        <figcaption>Caption 6</figcaption>
      </figure>
    </div>
  </body>
</html>
