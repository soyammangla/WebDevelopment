<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mini UI</title>
    <style>
      :root {
        --bg: #eef3ff;
        --card: #fff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Arial;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      header {
        background: #1f78d1;
        color: #fff;
        padding: 14px 20px;
      }
      header .inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        max-width: 1000px;
        margin: 0 auto;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px;
      }
      .card {
        background: var(--card);
        padding: 18px;
        border-radius: 12px;
        box-shadow: 0 14px 40px rgba(2, 6, 23, 0.06);
        display: flex;
        gap: 18px;
        align-items: flex-start;
        max-width: 900px;
        width: 100%;
        flex-wrap: wrap;
      }
      .form {
        flex: 1;
        min-width: 260px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      input,
      textarea,
      select {
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #ddd;
      }
      input:focus,
      textarea:focus {
        outline: 3px solid rgba(31, 120, 209, 0.12);
        outline-offset: 3px;
      }
      .controls {
        display: flex;
        gap: 10px;
        margin-top: 6px;
      }
      .btn {
        padding: 10px 14px;
        border-radius: 8px;
        border: none;
        background: #1f78d1;
        color: #fff;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn:hover {
        transform: translateY(-4px);
        box-shadow: 0 18px 36px rgba(31, 120, 209, 0.12);
      }
      .aside {
        width: 180px;
        text-align: center;
      }
      .aside img {
        width: 100%;
        border-radius: 8px;
        display: block;
      }
      footer {
        background: #fff;
        text-align: center;
        padding: 12px;
        border-top: 1px solid #eee;
      }
      @media (max-width: 800px) {
        .card {
          flex-direction: column;
          align-items: center;
        }
        .aside {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="inner">
        <div style="font-weight: 700">Mini UI</div>
        <nav style="color: #eaf3ff">Home • Features • Contact</nav>
      </div>
    </header>
    <main>
      <div class="card">
        <form class="form" onsubmit="return false">
          <label>Name</label>
          <input type="text" placeholder="Your name" />
          <label>Email</label>
          <input type="email" placeholder="you@example.com" />
          <label>Message</label>
          <textarea rows="4" placeholder="Write a message..."></textarea>
          <div class="controls">
            <button class="btn">Send</button>
            <button class="btn" style="background: #f3f4f6; color: #111">
              Cancel
            </button>
          </div>
        </form>

        <aside class="aside">
          <img src="https://picsum.photos/200" alt="small" />
          <div style="margin-top: 10px; color: #666; font-size: 0.95rem">
            Profile / image
          </div>
        </aside>
      </div>
    </main>
    <footer>© 2025 Mini UI — compact responsive layout</footer>
  </body>
</html>
