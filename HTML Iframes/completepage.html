<!-- complete-head.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- meta description for search engines / preview -->
    <meta name="description" content="Example page showing head elements" />
    <!-- author metadata -->
    <meta name="author" content="Your Name" />
    <!-- base URL for relative links -->
    <base href="https://example.com/" />
    <!-- favicon link -->
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <!-- internal styles (can be empty) -->
    <style>
      /* Styles go here */
    </style>
    <!-- optional scripts (can be empty) -->
    <script>
      // Scripts go here
    </script>
    <title>Complete Head Example</title>

    <!--
    Comments:
    - <title>: shown in browser tab and used by search engines.
    - <meta charset>: sets character encoding (UTF-8 recommended).
    - <meta description>: short description for search results and previews.
    - <meta author>: identifies page author.
    - <base>: sets the base URL for all relative URLs on the page.
    - <link>: links external resources like favicons or stylesheets.
    - <style>: internal CSS can be placed here.
    - <script>: JavaScript can be added here (or linked externally).
  --></head>
  <body>
    <h1>Page with complete head</h1>
    <p>Open view-source to inspect all head elements and comments.</p>
  </body>
</html>
