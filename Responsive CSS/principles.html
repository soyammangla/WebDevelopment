<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Design Principles</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f6f7fb;
        padding: 40px;
      }
      h1 {
        text-align: center;
        margin-bottom: 30px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
      .box {
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        transition: all 0.3s;
        text-align: center;
      }
      .box:hover {
        background: linear-gradient(135deg, #1f78d1, #34c6eb);
        color: #fff;
      }
      pre {
        background: #eee;
        padding: 10px;
        border-radius: 5px;
        overflow-x: auto;
        text-align: left;
        margin-top: 10px;
      }
      @media (max-width: 600px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <h1>Responsive Design Principles</h1>
    <div class="grid">
      <div class="box">
        <h3>Fluid Layouts</h3>
        <p>Elements resize according to screen width.</p>
        <pre>width: 80%;</pre>
      </div>
      <div class="box">
        <h3>Flexible Media</h3>
        <p>Images and videos scale with container.</p>
        <pre>img{max-width:100%;height:auto;}</pre>
      </div>
      <div class="box">
        <h3>Breakpoints</h3>
        <p>Use media queries to adjust layout.</p>
        <pre>@media(max-width:768px){...}</pre>
      </div>
    </div>
  </body>
</html>
