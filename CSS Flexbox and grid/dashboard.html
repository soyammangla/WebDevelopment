<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Layout - CSS Grid</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f2f2f2;
      }

      /* GRID LAYOUT */
      .container {
        display: grid;
        grid-template-columns: 250px 1fr;
        grid-template-rows: 70px auto;
        grid-template-areas:
          "header header"
          "sidebar main";
        height: 100vh;
        gap: 15px;
        padding: 15px;
      }

      /* HEADER */
      header {
        grid-area: header;
        background: #222;
        color: white;
        display: flex;
        align-items: center;
        padding: 20px;
        font-size: 1.4rem;
        border-radius: 8px;
      }

      /* SIDEBAR */
      aside {
        grid-area: sidebar;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0px 2px 6px rgba(0, 0, 0, 0.15);
      }

      aside ul {
        list-style: none;
      }

      aside li {
        padding: 12px 5px;
        margin-bottom: 8px;
        background: #f4f4f4;
        border-radius: 6px;
        text-align: center;
        cursor: pointer;
        transition: 0.3s;
      }

      aside li:hover {
        background: #ddd;
      }

      /* MAIN CONTENT GRID */
      main {
        grid-area: main;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-auto-rows: 180px;
        gap: 15px;
      }

      .box {
        background: white;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.3rem;
        font-weight: bold;
        box-shadow: 0px 2px 6px rgba(0, 0, 0, 0.15);
        transition: 0.3s;
      }

      .box:hover {
        transform: scale(1.03);
        box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.25);
      }

      /* ONE BOX SPANS TWO COLUMNS */
      .wide {
        grid-column: span 2;
      }

      /* RESPONSIVE */
      @media (max-width: 900px) {
        .container {
          grid-template-columns: 1fr;
          grid-template-rows: 70px auto auto;
          grid-template-areas:
            "header"
            "sidebar"
            "main";
        }

        main {
          grid-template-columns: 1fr;
        }

        .wide {
          grid-column: span 1;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- HEADER -->
      <header>Dashboard Header</header>

      <!-- SIDEBAR -->
      <aside>
        <ul>
          <li>Home</li>
          <li>Analytics</li>
          <li>Reports</li>
          <li>Settings</li>
        </ul>
      </aside>

      <!-- MAIN CONTENT -->
      <main>
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box wide">Wide Box (Span 2 Columns)</div>
        <div class="box">Box 4</div>
      </main>
    </div>
  </body>
</html>
