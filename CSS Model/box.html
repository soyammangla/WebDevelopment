<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box Model</title>

    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #eee;
        font-family: Arial;
      }

      .outer {
        background: #ffcccb;
        padding: 20px;
      }

      .middle {
        background: #add8e6;
        padding: 20px;
        border: 5px solid #333;
      }

      .inner {
        background: #90ee90;
        padding: 20px;
        margin: 10px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div class="outer">
      <div class="middle">
        <div class="inner">Content (Padding + Border + Margin Demo)</div>
      </div>
    </div>
  </body>
</html>
