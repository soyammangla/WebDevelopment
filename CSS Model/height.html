<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Height & Width Demo</title>

    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: #eee;
        font-family: Arial;
      }

      .wrapper {
        display: flex;
        gap: 20px;
      }

      .box {
        padding: 10px;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      .box1 {
        width: 150px;
        height: 150px;
        background: tomato;
      }

      .box2 {
        width: 40%;
        height: 30vh;
        background: royalblue;
        min-height: 120px;
      }

      .box3 {
        width: 10em;
        height: 10em;
        background: seagreen;
        max-width: 200px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="box box1">150px × 150px</div>
      <div class="box box2">40% width / 30vh height</div>
      <div class="box box3">10em box with max-width</div>
    </div>
  </body>
</html>
