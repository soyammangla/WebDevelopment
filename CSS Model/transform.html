<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transform Showcase</title>

    <style>
      body {
        font-family: Arial;
        padding: 20px;
      }
      .wrapper {
        display: flex;
        gap: 20px;
        justify-content: center;
      }
      .box {
        width: 120px;
        height: 120px;
        background: #3498db;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 0.4s ease;
        border-radius: 10px;
      }
      .rotate:hover {
        transform: rotate(20deg);
      }
      .scale:hover {
        transform: scale(1.2);
      }
      .translate:hover {
        transform: translateY(-15px);
      }
      .skew:hover {
        transform: skew(10deg);
      }
    </style>
  </head>
  <body>
    <h2 style="text-align: center">Transformations Demo</h2>

    <div class="wrapper">
      <div class="box rotate">Rotate</div>
      <div class="box scale">Scale</div>
      <div class="box translate">Translate</div>
      <div class="box skew">Skew</div>
    </div>
  </body>
</html>
