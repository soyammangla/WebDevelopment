<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricing Section</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f2f2f2;
        padding: 40px;
      }

      /* FLEX CONTAINER */
      .pricing {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 25px;
        animation: fadeIn 1.2s ease;
      }

      /* PRICING CARDS */
      .card {
        width: 280px;
        background: white;
        padding: 25px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0px 2px 12px rgba(0, 0, 0, 0.15);
        transition: 0.3s;
        animation: fadeIn 1s ease;
      }

      /* HOVER EFFECT */
      .card:hover {
        transform: translateY(-10px);
      }

      /* MIDDLE CARD SPECIAL STYLE */
      .middle {
        background: #222;
        color: white;
        transform: scale(1.08);
      }

      .card h2 {
        margin-bottom: 10px;
      }

      .price {
        font-size: 2rem;
        margin: 15px 0;
        font-weight: bold;
      }

      /* FADE-IN ANIMATION */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* RESPONSIVE BELOW 750px */
      @media (max-width: 750px) {
        .pricing {
          flex-direction: column;
        }

        .middle {
          transform: scale(1); /* Normal size in vertical view */
        }

        .card {
          width: 90%;
        }
      }
    </style>
  </head>

  <body>
    <h1 style="text-align: center; margin-bottom: 30px">Our Pricing Plans</h1>

    <div class="pricing">
      <!-- CARD 1 -->
      <div class="card">
        <h2>Basic</h2>
        <p class="price">$9 / month</p>
        <p>✔ 5 Projects</p>
        <p>✔ Basic Support</p>
        <p>✔ Limited Access</p>
      </div>

      <!-- CARD 2 (MIDDLE) -->
      <div class="card middle">
        <h2>Premium</h2>
        <p class="price">$19 / month</p>
        <p>✔ Unlimited Projects</p>
        <p>✔ Priority Support</p>
        <p>✔ Full Access</p>
      </div>

      <!-- CARD 3 -->
      <div class="card">
        <h2>Pro</h2>
        <p class="price">$29 / month</p>
        <p>✔ All Features</p>
        <p>✔ Dedicated Support</p>
        <p>✔ Team Access</p>
      </div>
    </div>
  </body>
</html>
