<!DOCTYPE html>
<html>
  <head>
    <title>Image Gallery with Modal</title>
    <style>
      body {
        font-family: Arial;
        padding: 20px;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
      }

      .gallery img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        cursor: pointer;
        border-radius: 8px;
        transition: 0.2s;
      }

      .gallery img:hover {
        transform: scale(1.05);
      }

      /* Modal */
      .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        display: none;
        justify-content: center;
        align-items: center;
      }

      .modal-content {
        background: white;
        padding: 10px;
        border-radius: 10px;
        max-width: 600px;
        max-height: 80%;
      }

      .modal-content img {
        width: 100%;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <h2>Image Gallery (Click to Preview)</h2>

    <div class="gallery">
      <img src="https://picsum.photos/id/1011/400/300" />
      <img src="https://picsum.photos/id/1025/400/300" />
      <img src="https://picsum.photos/id/1035/400/300" />
      <img src="https://picsum.photos/id/1040/400/300" />
      <img src="https://picsum.photos/id/1050/400/300" />
      <img src="https://picsum.photos/id/1060/400/300" />
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
      <div class="modal-content" id="modalContent">
        <img id="modalImg" src="" />
      </div>
    </div>

    <script>
      const modal = document.getElementById("modal");
      const modalImg = document.getElementById("modalImg");
      const modalContent = document.getElementById("modalContent");

      // Open modal when image is clicked
      document.querySelectorAll(".gallery img").forEach((img) => {
        img.addEventListener("click", () => {
          modal.style.display = "flex";
          modalImg.src = img.src;
        });
      });

      // Close when clicking outside modal
      modal.addEventListener("click", () => {
        modal.style.display = "none";
      });

      // Prevent closing when clicking inside modal
      modalContent.addEventListener("click", (e) => {
        e.stopPropagation();
      });
    </script>
  </body>
</html>
