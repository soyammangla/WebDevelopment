<!DOCTYPE html>
<html>
  <head>
    <title>Live Character Counter</title>
    <style>
      body {
        font-family: Arial;
        margin: 40px;
      }
      textarea {
        width: 100%;
        height: 120px;
        padding: 10px;
        font-size: 16px;
        border: 2px solid #ccc;
        border-radius: 8px;
        outline: none;
      }
      .counter {
        margin-top: 8px;
        font-size: 16px;
        font-weight: bold;
      }
      .warning {
        color: red;
      }
    </style>
  </head>
  <body>
    <h2>Live Character Counter</h2>

    <textarea id="textArea" maxlength="100"></textarea>

    <div class="counter">Characters: <span id="count">0</span> / 100</div>

    <script>
      const textArea = document.getElementById("textArea");
      const count = document.getElementById("count");

      textArea.addEventListener("input", () => {
        let currentLength = textArea.value.length;
        count.textContent = currentLength;

        if (currentLength >= 100) {
          count.classList.add("warning");
        } else {
          count.classList.remove("warning");
        }
      });
    </script>
  </body>
</html>
