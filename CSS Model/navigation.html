<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navigation Bar</title>

    <style>
      body {
        margin: 0;
        font-family: Arial;
      }

      nav {
        background: #333;
        color: white;
        display: flex;
        gap: 20px;
        justify-content: center;
        padding: 15px;
        flex-wrap: wrap;
      }

      nav a {
        color: white;
        text-decoration: none;
        padding: 10px 15px;
        border-radius: 5px;
        transition: 0.3s;
      }

      nav a:hover {
        background: #555;
      }

      nav .active {
        background: crimson;
      }

      footer {
        text-align: center;
        padding: 20px;
        background: #222;
        color: white;
      }

      @media (max-width: 700px) {
        nav {
          flex-direction: column;
          align-items: center;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <a class="active">Home</a>
      <a>About</a>
      <a>Services</a>
      <a>Portfolio</a>
      <a>Contact</a>
    </nav>

    <footer>© 2025 Navigation Demo</footer>
  </body>
</html>
