<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading Animation</title>

    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f5f5f5;
        font-family: Arial;
      }

      .loader {
        display: flex;
        gap: 12px;
      }

      .circle {
        width: 18px;
        height: 18px;
        background: #333;
        border-radius: 50%;
        animation: bounce 0.6s infinite alternate ease-in-out;
      }

      .circle:nth-child(2) {
        animation-delay: 0.15s;
      }

      .circle:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes bounce {
        0% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(-20px);
        }
      }
    </style>
  </head>
  <body>
    <div class="loader">
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
    </div>
  </body>
</html>
