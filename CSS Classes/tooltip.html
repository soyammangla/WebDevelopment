<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tooltip Demo</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial;
        background: #f4f7fb;
      }
      .wrap {
        display: flex;
        gap: 28px;
        align-items: center;
      }
      .item {
        position: relative;
        padding: 12px 18px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 6px 18px rgba(2, 6, 23, 0.06);
        cursor: default;
      }
      .item .tip {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(100% + 10px);
        background: #222;
        color: #fff;
        padding: 8px 10px;
        border-radius: 6px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease-in-out, transform 0.3s;
        transform-origin: 50% 100%;
        font-size: 0.9rem;
      }
      .item:hover .tip {
        opacity: 1;
        transform: translateX(-50%) translateY(-4px);
      }
      .icon {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1f78d1;
        color: #fff;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="item">
        <div class="icon">A</div>
        <div class="tip">Tooltip for A — more info</div>
      </div>

      <div class="item">
        <div class="icon">B</div>
        <div class="tip">Another tooltip (hover me)</div>
      </div>

      <div class="item">
        <div class="icon">?</div>
        <div class="tip">Help tooltip appears above</div>
      </div>
    </div>
  </body>
</html>
