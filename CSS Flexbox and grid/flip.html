<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Flip Animation</title>

    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f2f2f2;
        font-family: Arial;
      }

      .card-container {
        perspective: 1000px;
      }

      .card {
        width: 300px;
        height: 400px;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.8s;
      }

      .card-container:hover .card {
        transform: rotateY(180deg);
      }

      .side {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }

      .front {
        background: #fff;
        display: flex;
        flex-direction: column;
        text-align: center;
      }

      .front img {
        width: 100%;
        height: 250px;
        object-fit: cover;
      }

      .back {
        background: #222;
        color: #fff;
        padding: 30px;
        transform: rotateY(180deg);
      }
    </style>
  </head>
  <body>
    <div class="card-container">
      <div class="card">
        <div class="side front">
          <img src="https://picsum.photos/400" />
          <h2>Beautiful Place</h2>
        </div>

        <div class="side back">
          <h2>Description</h2>
          <p>
            This card flips using CSS transform, perspective, and transitions.
            Hover to see the back side!
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
