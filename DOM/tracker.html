<!DOCTYPE html>
<html>
  <head>
    <title>Mouse Path & Coordinates Tracker</title>
    <style>
      body {
        font-family: Arial;
        padding: 20px;
      }

      .box {
        width: 400px;
        height: 400px;
        border: 2px solid #333;
        position: relative;
        margin-top: 20px;
        user-select: none;
      }

      .coords {
        font-size: 20px;
        margin-top: 10px;
      }

      .dot {
        width: 10px;
        height: 10px;
        background: red;
        border-radius: 50%;
        position: absolute;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body>
    <h2>Mouse Path & Coordinates Logger</h2>

    <div class="box" id="box"></div>

    <div class="coords" id="coords">X: 0, Y: 0</div>

    <script>
      const box = document.getElementById("box");
      const coordsText = document.getElementById("coords");

      // Track mouse movement
      box.addEventListener("mousemove", (e) => {
        const rect = box.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        coordsText.textContent = `X: ${Math.floor(x)}, Y: ${Math.floor(y)}`;
      });

      // Drop a dot on double-click
      box.addEventListener("dblclick", (e) => {
        const rect = box.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const dot = document.createElement("div");
        dot.classList.add("dot");
        dot.style.left = `${x}px`;
        dot.style.top = `${y}px`;

        box.appendChild(dot);
      });
    </script>
  </body>
</html>
