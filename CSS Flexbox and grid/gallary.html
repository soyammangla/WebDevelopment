<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Gallery Grid</title>

    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: Arial;
        background: #f2f2f2;
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
      }

      .gallery {
        display: grid;
        gap: 20px;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      }

      figure {
        overflow: hidden;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      figure img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        transition: transform 0.5s ease;
        display: block;
      }

      figure:hover img {
        transform: scale(1.1);
      }

      figcaption {
        text-align: center;
        padding: 10px;
        font-size: 14px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <h1>Responsive Photo Gallery</h1>

    <div class="gallery">
      <figure>
        <img src="https://picsum.photos/300?random=1" />
        <figcaption>Nature View</figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/300?random=2" />
        <figcaption>Mountain Peak</figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/300?random=3" />
        <figcaption>City Lights</figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/300?random=4" />
        <figcaption>Ocean Waves</figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/300?random=5" />
        <figcaption>Forest Trail</figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/300?random=6" />
        <figcaption>Beautiful Sunset</figcaption>
      </figure>
    </div>
  </body>
</html>
