<!DOCTYPE html>
<html>
  <head>
    <title>Team Directory</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
      .manager {
        font-weight: bold;
        cursor: pointer;
        margin-top: 15px;
      }
      .employee {
        margin-left: 20px;
        cursor: pointer;
      }
      .info {
        display: none;
        color: darkblue;
      }
    </style>
  </head>
  <body>
    <div class="team">
      <div class="department">
        <div class="manager">Manager A</div>
        <div class="employee">
          Emp A1
          <div class="info">Contact: A1@gmail.com</div>
        </div>
        <div class="employee">
          Emp A2
          <div class="info">Contact: A2@gmail.com</div>
        </div>

        <div class="manager">Manager B</div>
        <div class="employee">
          Emp B1
          <div class="info">Contact: B1@gmail.com</div>
        </div>
        <div class="employee">
          Emp B2
          <div class="info">Contact: B2@gmail.com</div>
        </div>
      </div>
    </div>

    <script>
      $(function () {
        // 1. Manager click highlight direct reports
        $(".manager").click(function () {
          $(this).nextUntil(".manager").css("background", "yellow");
        });

        // 2. Hover employee → show next() info
        $(".employee").hover(
          function () {
            $(this).find(".info").show();
          },
          function () {
            $(this).find(".info").hide();
          }
        );

        // 3. Department click → color children
        $(".department").click(function () {
          $(this).children().css("background", "#d1f0ff");
        });

        // 4. Random employee → highlight siblings
        let allEmp = $(".employee");
        let random = allEmp.eq(Math.floor(Math.random() * allEmp.length));
        random.siblings(".employee").css("border", "2px solid red");

        // 5. Collapse/expand whole team
        $(".manager").dblclick(function () {
          $(this).parent().find(".employee").toggle();
        });
      });
    </script>
  </body>
</html>
