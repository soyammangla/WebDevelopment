<!DOCTYPE html>
<html>
  <head>
    <title>Search Courses</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
      .course {
        padding: 8px;
        background: #f3f3f3;
        margin: 5px 0;
      }
    </style>
  </head>
  <body>
    <input
      type="text"
      id="search"
      placeholder="Search course..."
      style="width: 300px; padding: 10px"
    />
    <h3>Matched: <span id="count">0</span></h3>

    <div id="list">
      <div class="course">JavaScript Basics</div>
      <div class="course">HTML & CSS</div>
      <div class="course">Python Programming</div>
      <div class="course">Machine Learning</div>
    </div>

    <script>
      $(function () {
        $("#search").keyup(function () {
          let text = $(this).val().toLowerCase();
          let matched = 0;

          $(".course").each(function () {
            let item = $(this).text().toLowerCase();

            if (item.includes(text)) {
              $(this).show().css("background", "lightyellow");
              matched++;
            } else {
              $(this).hide();
            }
          });

          $("#count").text(matched);
        });
      });
    </script>
  </body>
</html>
