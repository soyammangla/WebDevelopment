<!-- stacked-iframes.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Two Stacked Iframes</title>
  </head>
  <body>
    <h2>Introduction and Hobby (stacked)</h2>

    <!-- First iframe: intro page (replace src with your actual page) -->
    <iframe
      src="intro.html"
      title="Introduction"
      width="90%"
      height="300"
      style="display: block; margin: 10px auto"
    ></iframe>

    <!-- Second iframe: hobby page (replace src with your actual page) -->
    <iframe
      src="hobby.html"
      title="Favorite Hobby"
      width="90%"
      height="300"
      style="display: block; margin: 10px auto"
    ></iframe>
  </body>
</html>
