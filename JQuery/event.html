<!DOCTYPE html>
<html>
  <head>
    <title>Subscription Panel</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
      .topic {
        margin: 8px 0;
      }
    </style>
  </head>
  <body>
    <h2>Subscriptions</h2>

    <div id="topics">
      <div class="topic">Sports</div>
      <div class="topic">Tech</div>
    </div>

    <button id="sub">Subscribe</button>
    <button id="unsub">Unsubscribe</button>
    <button id="add">Add Topic</button>
    <button id="remove">Remove Last Topic</button>

    <div id="msg"></div>

    <script>
      $(function () {
        // 1 Subscribe
        $("#sub").click(function () {
          $("#msg").text("Notifications enabled!");
        });

        // 2 Unsubscribe
        $("#unsub").click(function () {
          $("#msg").text("Notifications disabled.");
        });

        // 3 Add topic with .on()
        $("#add").click(function () {
          $("#topics").append('<div class="topic">New Topic</div>');
        });

        // 4 Remove last topic (off)
        $("#remove").click(function () {
          $("#topics .topic").last().remove();
        });
      });
    </script>
  </body>
</html>
