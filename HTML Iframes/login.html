<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Login</title>
  </head>
  <body>
    <h2>Login</h2>
    <!--
    A CSRF token helps the server verify that the form submission is coming from
    the legitimate site/session and not from a cross-site request forgery attack.
  -->
    <form action="#" method="post">
      <label>Username: <input type="text" name="username" required /></label
      ><br /><br />
      <label>Password: <input type="password" name="password" required /></label
      ><br /><br />
      <input type="hidden" name="csrf_token" value="dummy_csrf_token_12345" />
      <button type="submit">Login</button>
    </form>
  </body>
</html>
