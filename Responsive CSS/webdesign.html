<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Web Design Layout</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Arial, sans-serif;
        background: #f4f6fb;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px;
        background: #1f78d1;
        color: #fff;
      }
      nav a {
        margin-left: 15px;
        color: #fff;
        text-decoration: none;
      }
      main {
        display: flex;
        justify-content: center;
        gap: 20px;
        padding: 40px;
        flex-wrap: wrap;
      }
      .feature {
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        flex: 1 1 250px;
        text-align: center;
        transition: transform 0.3s;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      }
      .feature:hover {
        transform: scale(1.05);
      }
      footer {
        text-align: center;
        padding: 20px;
        background: #1f78d1;
        color: #fff;
        margin-top: 20px;
      }
      @media (max-width: 750px) {
        main {
          flex-direction: column;
          align-items: center;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">MyLogo</div>
      <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>
    </header>
    <main>
      <div class="feature">Feature 1</div>
      <div class="feature">Feature 2</div>
      <div class="feature">Feature 3</div>
    </main>
    <footer>© 2025 Responsive Layout</footer>
  </body>
</html>
