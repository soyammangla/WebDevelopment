<!-- payment.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Payment</title>
  </head>
  <body>
    <h2>Payment Form</h2>
    <form action="#" method="post">
      <label
        >Cardholder Name: <input type="text" name="card_name" required /></label
      ><br /><br />
      <label
        >Card Number:
        <input type="text" name="card_number" maxlength="19" required /></label
      ><br /><br />
      <label>Expiry Date: <input type="month" name="expiry" required /></label
      ><br /><br />
      <label
        >CVV: <input type="password" name="cvv" maxlength="4" required /></label
      ><br /><br />
      <button type="submit">Pay Now</button>
    </form>
  </body>
</html>
