<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog Pagination</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container py-5">
      <h2 class="mb-4 text-center">Blog Posts</h2>

      <div class="row g-4">
        <div class="col-md-6">
          <div class="card">
            <img
              src="https://picsum.photos/400/200?1"
              class="card-img-top"
              alt=""
            />
            <div class="card-body">
              <h5 class="card-title">Post 1</h5>
              <p class="card-text">Lorem ipsum dolor sit amet.</p>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card">
            <img
              src="https://picsum.photos/400/200?2"
              class="card-img-top"
              alt=""
            />
            <div class="card-body">
              <h5 class="card-title">Post 2</h5>
              <p class="card-text">Consectetur adipiscing elit.</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Pagination -->
      <nav aria-label="Page navigation example" class="my-4">
        <ul class="pagination justify-content-center">
          <li class="page-item"><a class="page-link" href="#">Previous</a></li>
          <li class="page-item"><a class="page-link" href="#">1</a></li>
          <li class="page-item"><a class="page-link" href="#">2</a></li>
          <li class="page-item"><a class="page-link" href="#">Next</a></li>
        </ul>
      </nav>

      <!-- Pager -->
      <div class="d-flex justify-content-between mb-5">
        <button class="btn btn-outline-secondary">Older Posts</button>
        <button class="btn btn-outline-secondary">Newer Posts</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
