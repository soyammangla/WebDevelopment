<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quotes</title>
  </head>
  <body>
    <h2>Quotes Example</h2>

    <blockquote cite="https://example.com">
      "The only limit to our realization of tomorrow is our doubts of today." —
      A long quotation (use blockquote for longer text).
    </blockquote>

    <p>
      Here is a short quote inside a paragraph:
      <q>Keep it simple &amp; clear.</q>
    </p>
  </body>
</html>
