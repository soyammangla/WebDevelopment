<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pricing Plans</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .card:hover {
        transform: scale(1.05);
        transition: all 0.3s;
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <h2 class="text-center mb-4">Choose Your Plan</h2>
      <div class="row g-4">
        <div class="col-md-4">
          <div class="card text-center p-4">
            <h4>Basic</h4>
            <h2>$10/mo</h2>
            <ul class="list-unstyled">
              <li>Feature 1</li>
              <li>Feature 2</li>
            </ul>
            <a href="#" class="btn btn-outline-primary">Select</a>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card text-center p-4 bg-primary text-white">
            <h4>Pro</h4>
            <h2>$30/mo</h2>
            <ul class="list-unstyled">
              <li>Feature 1</li>
              <li>Feature 2</li>
              <li>Feature 3</li>
            </ul>
            <a href="#" class="btn btn-light">Select</a>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card text-center p-4">
            <h4>Enterprise</h4>
            <h2>$50/mo</h2>
            <ul class="list-unstyled">
              <li>Feature 1</li>
              <li>Feature 2</li>
              <li>Feature 3</li>
              <li>Feature 4</li>
            </ul>
            <a href="#" class="btn btn-outline-primary">Select</a>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
