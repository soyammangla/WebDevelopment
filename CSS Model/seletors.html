<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Selectors</title>

    <style>
      /* ATTRIBUTE SELECTORS */
      input[type="text"] {
        background: #e8f0fe;
        padding: 8px;
      }
      a[href^="https"] {
        color: green;
      }

      /* PSEUDO-CLASSES */
      li:hover {
        color: red;
      }
      input:focus {
        border: 2px solid blue;
      }

      /* NTH CHILD */
      li:nth-child(2) {
        font-weight: bold;
      }

      /* PSEUDO-ELEMENTS */
      p::first-letter {
        font-size: 200%;
        color: tomato;
      }
      p::after {
        content: " ✦";
        color: orange;
      }

      /* COMBINATORS */
      ul > li {
        margin-bottom: 10px;
      }
      h3 + p {
        color: blue;
      }
      h3 ~ span {
        color: purple;
      }
    </style>
  </head>
  <body>
    <h2>CSS Selectors Demo</h2>

    <input type="text" placeholder="Type here..." /><br /><br />
    <a href="https://google.com">Google Secure Link</a>

    <ul>
      <li>Item One</li>
      <li>Item Two</li>
      <li>Item Three</li>
    </ul>

    <h3>Heading</h3>
    <p>Paragraph after heading.</p>
    <span>Sibling element styled with ~</span>
  </body>
</html>
