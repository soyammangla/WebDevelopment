<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Custom Blog</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bs-primary: #ff6600;
        --bs-font-sans-serif: "Roboto", sans-serif;
      }
      h1,
      h2 {
        color: var(--bs-primary);
      }
    </style>
  </head>
  <body>
    <header class="bg-light py-3 text-center">
      <h1>My Blog</h1>
    </header>

    <div class="container py-5">
      <div class="row g-4">
        <div class="col-md-6">
          <div class="card shadow-sm">
            <img
              src="https://picsum.photos/400/200?1"
              class="card-img-top"
              alt=""
            />
            <div class="card-body">
              <h5 class="card-title">Blog Post 1</h5>
              <p class="card-text">
                Lorem ipsum dolor sit amet, consectetur adipiscing elit.
              </p>
              <a href="#" class="btn btn-primary">Read More</a>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card shadow-sm">
            <img
              src="https://picsum.photos/400/200?2"
              class="card-img-top"
              alt=""
            />
            <div class="card-body">
              <h5 class="card-title">Blog Post 2</h5>
              <p class="card-text">
                Sed do eiusmod tempor incididunt ut labore et dolore magna
                aliqua.
              </p>
              <a href="#" class="btn btn-primary">Read More</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer class="bg-light py-3 text-center">© 2025 My Blog</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
