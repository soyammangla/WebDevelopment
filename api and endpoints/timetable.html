<!DOCTYPE html>
<html>
  <head>
    <title>Timetable Viewer</title>
  </head>
  <body>
    <h2>College Timetable</h2>

    <select id="day">
      <option>Monday</option>
      <option>Tuesday</option>
      <option>Wednesday</option>
      <option>Thursday</option>
      <option>Friday</option>
    </select>

    <div id="list"></div>

    <script>
      function load() {
        let day = document.getElementById("day").value;

        fetch("http://localhost:3000/timetable?day=" + day)
          .then((res) => res.json())
          .then((data) => {
            let box = document.getElementById("list");
            box.innerHTML = "";

            if (data.length === 0) {
              box.innerHTML = "<p>No classes today.</p>";
              return;
            }

            data.forEach((t) => {
              box.innerHTML += `
          <p>
            <strong>${t.subject}</strong> — ${t.faculty} — ${t.time}
          </p>
        `;
            });
          });
      }

      document.getElementById("day").addEventListener("change", load);

      load();
    </script>
  </body>
</html>
