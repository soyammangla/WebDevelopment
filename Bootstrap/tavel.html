<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Travel Agency</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container py-5">
      <h2 class="text-center mb-4">Explore the World</h2>

      <!-- Carousel -->
      <div
        id="travelCarousel"
        class="carousel slide mb-4"
        data-bs-ride="carousel"
      >
        <div class="carousel-inner">
          <div class="carousel-item active" data-bs-interval="2000">
            <img
              src="https://picsum.photos/800/300?1"
              class="d-block w-100"
              alt="Destination 1"
            />
            <div class="carousel-caption d-none d-md-block">
              <h5>Paris, France</h5>
              <p>The city of lights awaits.</p>
            </div>
          </div>
          <div class="carousel-item" data-bs-interval="3000">
            <img
              src="https://picsum.photos/800/300?2"
              class="d-block w-100"
              alt="Destination 2"
            />
            <div class="carousel-caption d-none d-md-block">
              <h5>Bali, Indonesia</h5>
              <p>Relax on beautiful beaches.</p>
            </div>
          </div>
          <div class="carousel-item" data-bs-interval="2500">
            <img
              src="https://picsum.photos/800/300?3"
              class="d-block w-100"
              alt="Destination 3"
            />
            <div class="carousel-caption d-none d-md-block">
              <h5>New York, USA</h5>
              <p>The city that never sleeps.</p>
            </div>
          </div>
        </div>
        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#travelCarousel"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon"></span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#travelCarousel"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon"></span>
        </button>
      </div>

      <!-- Progress Bar -->
      <h5>Booking Completion</h5>
      <div class="progress mb-5">
        <div
          class="progress-bar progress-bar-striped progress-bar-animated"
          role="progressbar"
          style="width: 70%"
          aria-valuenow="70"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          70%
        </div>
      </div>
    </div>

    <footer class="bg-light text-center py-3">
      Contact us: info@travelagency.com
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
