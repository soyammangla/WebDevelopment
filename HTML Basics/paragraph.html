<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paragraph with Highlight and Note</title>
  </head>
  <body>
    <h1>My Daily Routine</h1>
    <p>
      Every morning, I start my day with a <mark>healthy breakfast</mark> to
      stay energized and focused. After that, I spend some time reading or
      coding to improve my skills.
      <br />
      <small>Updated recently</small>
    </p>
  </body>
</html>
