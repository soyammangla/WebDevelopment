<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Combined Responsive Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: #f6f7fb;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px;
        background: #1f78d1;
        color: #fff;
      }
      nav a {
        margin-left: 15px;
        color: #fff;
        text-decoration: none;
      }
      main {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 20px;
        padding: 20px;
        animation: fadeIn 1s ease forwards;
      }
      .gallery,
      .text,
      .cheatsheet {
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
        gap: 10px;
      }
      .gallery img {
        width: 100%;
        border-radius: 5px;
        transition: transform 0.3s;
      }
      .gallery img:hover {
        transform: scale(1.05);
      }
      footer {
        text-align: center;
        padding: 20px;
        background: #1f78d1;
        color: #fff;
        margin-top: 20px;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (max-width: 700px) {
        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">MyLogo</div>
      <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>
    </header>
    <main>
      <div class="gallery">
        <img src="https://picsum.photos/id/1011/200/150" alt="" />
        <img src="https://picsum.photos/id/1012/200/150" alt="" />
        <img src="https://picsum.photos/id/1013/200/150" alt="" />
      </div>
      <div class="text">
        <h2>Responsive Design</h2>
        <p>
          Uses Flexbox and Grid to adapt layout across devices. Hover effects
          and animations improve UX.
        </p>
      </div>
      <div class="cheatsheet">
        <h2>CSS Cheat Sheet</h2>
        <p>
          Media queries, filters, typography, and flex/grid examples for
          learning.
        </p>
      </div>
    </main>
    <footer>© 2025 Combined Demo</footer>
  </body>
</html>
