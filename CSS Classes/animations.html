<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Animation Demo</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f7fb;
        font-family: Arial;
      }
      .wrap {
        display: flex;
        gap: 30px;
        align-items: center;
      }
      /* moving box */
      .move {
        width: 80px;
        height: 80px;
        background: #1f78d1;
        border-radius: 8px;
        animation: moveX 2s ease-in-out infinite alternate;
      }
      @keyframes moveX {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(40px);
        }
      }
      /* bouncing ball */
      .ball {
        width: 60px;
        height: 60px;
        background: #ff6b6b;
        border-radius: 50%;
        animation: bounce 0.8s ease-in-out infinite;
        animation-delay: 0.15s;
      }
      @keyframes bounce {
        0% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-40px);
        }
        100% {
          transform: translateY(0);
        }
      }
      /* color changing text */
      .text {
        font-weight: 700;
        font-size: 1rem;
        animation: colorChange 3s ease-in-out infinite alternate;
      }
      @keyframes colorChange {
        0% {
          color: #222;
        }
        50% {
          color: #1f78d1;
        }
        100% {
          color: #ff6b6b;
        }
      }
      /* layout */
      .col {
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="col">
        <div class="move"></div>
        <div>Moving (infinite)</div>
      </div>
      <div class="col">
        <div class="ball"></div>
        <div>Bouncing (.8s delay)</div>
      </div>
      <div class="col">
        <div class="text">Color Changing Text</div>
        <div>3s alternate</div>
      </div>
    </div>
  </body>
</html>
