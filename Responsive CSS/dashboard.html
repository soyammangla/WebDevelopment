<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Dashboard Summary</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: #f6f7fb;
      }
      .dashboard {
        display: grid;
        grid-template-columns: 1fr 3fr;
        grid-template-rows: auto;
        gap: 20px;
        padding: 20px;
        animation: fadeIn 1s ease forwards;
      }
      header {
        grid-column: 1/-1;
        background: #1f78d1;
        color: #fff;
        padding: 20px;
        text-align: center;
      }
      aside {
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      }
      main {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 20px;
      }
      .card {
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        transition: transform 0.3s;
      }
      .card:hover {
        transform: scale(1.05);
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (max-width: 750px) {
        .dashboard {
          grid-template-columns: 1fr;
          grid-template-rows: auto;
        }
        aside {
          order: -1;
        }
      }
    </style>
  </head>
  <body>
    <div class="dashboard">
      <header>Responsive Dashboard</header>
      <aside>
        <h3>Sidebar</h3>
        <p>Navigation links</p>
      </aside>
      <main>
        <div class="card">Filters</div>
        <div class="card">Typography</div>
        <div class="card">Media Queries</div>
        <div class="card">Cheat Sheet Links</div>
      </main>
    </div>
  </body>
</html>
