<!-- map-embed.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Google Map Embed</title>
  </head>
  <body>
    <h2>Map (New Delhi shown as an example)</h2>

    <!--
    loading="lazy" delays loading the iframe until it is near the viewport,
    improving page performance and reducing initial network usage.
  -->
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d224345.8393831542!2d77.06889770813079!3d28.52728048681714!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390d1f6b1c000001%3A0x1234567890abcdef!2sNew%20Delhi%2C%20India!5e0!3m2!1sen!2sin!4v1600000000000!5m2!1sen!2sin"
      title="Map of New Delhi, India"
      width="80%"
      height="450"
      style="border: 0"
      allowfullscreen=""
      loading="lazy"
    >
    </iframe>
  </body>
</html>
