<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Restaurant Menu</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container py-5">
      <h1 class="text-center mb-4">Today's Menu</h1>

      <table class="table table-striped text-center">
        <thead>
          <tr>
            <th>Dish</th>
            <th>Category</th>
            <th>Price</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Pasta Alfredo</td>
            <td>Main</td>
            <td>$12</td>
          </tr>
          <tr>
            <td>Caesar Salad</td>
            <td>Starter</td>
            <td>$8</td>
          </tr>
          <tr>
            <td>Chocolate Cake</td>
            <td>Dessert</td>
            <td>$6</td>
          </tr>
        </tbody>
      </table>

      <h3 class="text-center mt-5">Chef's Specials</h3>
      <ul class="list-group mb-4">
        <li class="list-group-item">Grilled Salmon</li>
        <li class="list-group-item">Truffle Risotto</li>
      </ul>

      <figure class="text-center">
        <img
          src="https://picsum.photos/400/200"
          class="img-fluid rounded mb-2"
          alt=""
        />
        <figcaption class="lead">Today's Highlight Dish</figcaption>
      </figure>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
