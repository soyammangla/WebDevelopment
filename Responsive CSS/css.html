<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive CSS Cheat Sheet</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6fb;
        padding: 40px;
      }
      h1 {
        text-align: center;
        margin-bottom: 30px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
      }
      .box {
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        transition: transform 0.3s;
      }
      .box:hover {
        transform: scale(1.05);
      }
      @media (max-width: 700px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <h1>Responsive CSS Cheat Sheet</h1>
    <div class="grid">
      <div class="box">
        <h3>Filters</h3>
        <p>blur, grayscale, sepia, brightness, contrast</p>
      </div>
      <div class="box">
        <h3>Media Queries</h3>
        <p>@media (max-width: 768px) {...}</p>
      </div>
      <div class="box">
        <h3>Responsive Design</h3>
        <p>Flexbox, Grid, fluid layouts</p>
      </div>
      <div class="box">
        <h3>Typography</h3>
        <p>clamp(), relative units, line-height</p>
      </div>
    </div>
  </body>
</html>
