<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Course Registration</title>
  </head>
  <body>
    <header>
      <h1>Course Registration</h1>
    </header>

    <main>
      <form action="#" method="post">
        <fieldset>
          <legend>Student Details</legend>
          <label for="name">Full Name:</label><br />
          <input type="text" id="name" name="name" required /><br /><br />

          <label for="email">Email:</label><br />
          <input type="email" id="email" name="email" required /><br /><br />
        </fieldset>

        <fieldset>
          <legend>Course Selection</legend>
          <label for="course">Choose a course:</label><br />
          <select id="course" name="course">
            <option value="webdev" selected>Web Development</option>
            <option value="datasci">Data Science</option>
            <option value="ml">Machine Learning</option>
            <option value="uiux">UI/UX Design</option></select
          ><br /><br />
        </fieldset>

        <input type="submit" value="Register" />
      </form>

      <h2>Available Course Schedules</h2>
      <table border="1">
        <thead>
          <tr>
            <th>Day</th>
            <th>Time</th>
            <th>Instructor</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Monday</td>
            <td>10:00 - 12:00</td>
            <td>Ms. A. Sharma</td>
          </tr>
          <tr>
            <td>Wednesday</td>
            <td>14:00 - 16:00</td>
            <td>Mr. R. Singh</td>
          </tr>
          <tr>
            <td>Friday</td>
            <td>18:00 - 20:00</td>
            <td>Dr. P. Rao</td>
          </tr>
        </tbody>
      </table>
    </main>

    <footer>
      <p>Contact: admissions@example.com</p>
    </footer>
  </body>
</html>
