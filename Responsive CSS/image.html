<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Image Filter Gallery</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background: #f6f7fb;
      }
      h1 {
        text-align: center;
        margin-bottom: 20px;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
      }
      figure {
        overflow: hidden;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      }
      figure img {
        width: 100%;
        display: block;
        transition: all 0.4s ease;
      }
      figure:nth-child(1) img {
        filter: blur(2px);
      }
      figure:nth-child(2) img {
        filter: grayscale(100%);
      }
      figure:nth-child(3) img {
        filter: sepia(80%);
      }
      figure:nth-child(4) img {
        filter: brightness(0.6);
      }
      figure:nth-child(5) img {
        filter: contrast(150%);
      }
      figure:nth-child(6) img {
        filter: hue-rotate(90deg);
      }
      figure img:hover {
        filter: none;
      }
      figcaption {
        padding: 10px;
        text-align: center;
        background: #fff;
      }
      @media (max-width: 600px) {
        .gallery {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <h1>Responsive Image Filter Gallery</h1>
    <div class="gallery">
      <figure>
        <img src="https://picsum.photos/id/1011/400/300" alt="" />
        <figcaption>Blur</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1025/400/300" alt="" />
        <figcaption>Grayscale</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1035/400/300" alt="" />
        <figcaption>Sepia</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1043/400/300" alt="" />
        <figcaption>Brightness</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1052/400/300" alt="" />
        <figcaption>Contrast</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1060/400/300" alt="" />
        <figcaption>Hue-Rotate</figcaption>
      </figure>
    </div>
  </body>
</html>
