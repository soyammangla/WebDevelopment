<!DOCTYPE html>
<html>
  <head>
    <title>Theme Switcher</title>
    <style>
      body {
        font-family: Arial;
        transition: 0.3s;
        padding: 40px;
      }

      .btns button {
        padding: 10px 20px;
        margin-right: 10px;
        border: none;
        cursor: pointer;
        font-size: 16px;
        border-radius: 6px;
      }

      /* Themes */
      body[data-theme="light"] {
        background: #ffffff;
        color: #000;
      }

      body[data-theme="dark"] {
        background: #121212;
        color: #fff;
      }

      body[data-theme="blue"] {
        background: #1e90ff;
        color: #fff;
      }

      .btn-light {
        background: #eee;
      }
      .btn-dark {
        background: #333;
        color: white;
      }
      .btn-blue {
        background: #0074e8;
        color: white;
      }
    </style>
  </head>
  <body data-theme="light">
    <h2>Theme Switcher (Light / Dark / Blue)</h2>

    <div class="btns">
      <button class="btn-light">Light</button>
      <button class="btn-dark">Dark</button>
      <button class="btn-blue">Blue</button>
    </div>

    <script>
      const body = document.body;

      // Buttons
      document.querySelector(".btn-light").addEventListener("click", () => {
        body.setAttribute("data-theme", "light");
      });

      document.querySelector(".btn-dark").addEventListener("click", () => {
        body.setAttribute("data-theme", "dark");
      });

      document.querySelector(".btn-blue").addEventListener("click", () => {
        body.setAttribute("data-theme", "blue");
      });
    </script>
  </body>
</html>
