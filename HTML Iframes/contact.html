<!-- contact.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Contact</title>
  </head>
  <body>
    <h2>Contact Us</h2>
    <form action="#" method="post">
      <label
        >Full Name:
        <input
          type="text"
          name="name"
          placeholder="Your full name"
          required /></label
      ><br /><br />
      <label
        >Email:
        <input
          type="email"
          name="email"
          placeholder="you@example.com"
          required /></label
      ><br /><br />
      <label
        >Subject:
        <input
          type="text"
          name="subject"
          placeholder="Subject"
          required /></label
      ><br /><br />
      <label
        >Message:<br />
        <textarea
          name="message"
          placeholder="Write your message here..."
          rows="6"
          required
        ></textarea></label
      ><br /><br />
      <button type="submit">Send</button>
    </form>
  </body>
</html>
