<!-- embed-wikipedia.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Embed Example</title>
  </head>
  <body>
    <h2>Wikipedia embedded</h2>
    <iframe
      src="https://www.wikipedia.org"
      title="Wikipedia"
      width="90%"
      height="600"
      style="border: 1px solid #ccc"
    ></iframe>

    <p>Some websites may not allow embedding for security reasons.</p>
  </body>
</html>
