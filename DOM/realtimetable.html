<!DOCTYPE html>
<html>
  <head>
    <title>Real-Time Table Filter</title>
    <style>
      body {
        font-family: Arial;
        padding: 20px;
      }

      input {
        width: 300px;
        padding: 10px;
        margin-bottom: 20px;
        font-size: 16px;
        border-radius: 8px;
        border: 2px solid #ccc;
        outline: none;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }

      th,
      td {
        border: 1px solid #ddd;
        padding: 10px;
      }

      th {
        background: #f2f2f2;
      }

      .no-result {
        margin-top: 10px;
        font-size: 18px;
        font-weight: bold;
        color: red;
        display: none;
      }
    </style>
  </head>
  <body>
    <h2>Student Table Filter</h2>

    <input
      type="text"
      id="search"
      placeholder="Search by name, branch, or CGPA"
    />

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Branch</th>
          <th>CGPA</th>
        </tr>
      </thead>

      <tbody id="tableBody">
        <tr>
          <td>Rohan</td>
          <td>CSE</td>
          <td>8.5</td>
        </tr>
        <tr>
          <td>Neha</td>
          <td>ECE</td>
          <td>7.9</td>
        </tr>
        <tr>
          <td>Aditya</td>
          <td>ME</td>
          <td>9.1</td>
        </tr>
        <tr>
          <td>Priya</td>
          <td>CSE</td>
          <td>8.0</td>
        </tr>
        <tr>
          <td>Vikas</td>
          <td>CE</td>
          <td>7.4</td>
        </tr>
      </tbody>
    </table>

    <div class="no-result" id="noResult">No results found</div>

    <script>
      const search = document.getElementById("search");
      const rows = document.querySelectorAll("#tableBody tr");
      const noResult = document.getElementById("noResult");

      search.addEventListener("input", () => {
        const query = search.value.toLowerCase();
        let visibleCount = 0;

        rows.forEach((row) => {
          const text = row.innerText.toLowerCase();

          if (text.includes(query)) {
            row.style.display = "";
            visibleCount++;
          } else {
            row.style.display = "none";
          }
        });

        noResult.style.display = visibleCount === 0 ? "block" : "none";
      });
    </script>
  </body>
</html>
