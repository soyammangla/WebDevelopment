<!-- form.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Form with iframe result</title>
  </head>
  <body>
    <h2>Submit Form</h2>
    <form action="result.html" method="get" target="resultFrame">
      <label>Message: <input type="text" name="msg" required /></label>
      <button type="submit">Submit</button>
    </form>

    <h3>Result below:</h3>
    <iframe
      name="resultFrame"
      width="80%"
      height="150"
      style="border: 1px solid #ccc"
    ></iframe>
  </body>
</html>
